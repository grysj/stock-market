name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Run unit tests
        run: |
          gotestsum \
            --junitfile results.xml \
            --jsonfile results.json \
            -- ./tests/unit/... \
            -count=1 \
            -coverprofile=coverage.out \
            -coverpkg=./internal/...
      - name: Coverage summary
        if: always()
        run: |
          echo '## Unit test coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit test results
          path: results.xml
          reporter: java-junit
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            results.xml
            results.json
            coverage.out

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: stocks_test
          POSTGRES_USER: stocks
          POSTGRES_PASSWORD: stocks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stocks -d stocks_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest
      - name: Run Flyway migrations
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}/db_schema:/flyway/sql:ro \
            flyway/flyway:10-alpine \
            -url=jdbc:postgresql://localhost:5432/stocks_test \
            -user=stocks \
            -password=stocks \
            -connectRetries=10 \
            migrate
      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: stocks_test
          DB_USER: stocks
          DB_PASSWORD: stocks
        run: |
          gotestsum \
            --junitfile results.xml \
            --jsonfile results.json \
            -- ./tests/integration/... \
            -count=1 \
            -coverprofile=coverage.out \
            -coverpkg=./internal/...
      - name: Coverage summary
        if: always()
        run: |
          echo '## Integration test coverage' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration test results
          path: results.xml
          reporter: java-junit
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            results.xml
            results.json
            coverage.out
