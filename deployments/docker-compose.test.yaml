services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    ports:
      - "8081:80"
    volumes:
      - ./deployments/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:80/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - net-app1
      - net-app2
      - net-app3

  app1:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    environment:
      PORT: 8080
      DB_HOST: db_test
      DB_PORT: 5432
      DB_NAME: stocks_test
      DB_USER: stocks
      DB_PASSWORD: stocks
    depends_on:
      db_test:
        condition: service_healthy
      flyway_test:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - net-app1
      - net-db

  app2:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    environment:
      PORT: 8080
      DB_HOST: db_test
      DB_PORT: 5432
      DB_NAME: stocks_test
      DB_USER: stocks
      DB_PASSWORD: stocks
    depends_on:
      db_test:
        condition: service_healthy
      flyway_test:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - net-app2
      - net-db

  app3:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    environment:
      PORT: 8080
      DB_HOST: db_test
      DB_PORT: 5432
      DB_NAME: stocks_test
      DB_USER: stocks
      DB_PASSWORD: stocks
    depends_on:
      db_test:
        condition: service_healthy
      flyway_test:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - net-app3
      - net-db

  db_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stocks_test
      POSTGRES_USER: stocks
      POSTGRES_PASSWORD: stocks
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocks -d stocks_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - net-db

  flyway_test:
    image: flyway/flyway:10-alpine
    depends_on:
      db_test:
        condition: service_healthy
    command: >
      -url=jdbc:postgresql://db_test:5432/stocks_test
      -user=stocks
      -password=stocks
      -connectRetries=60
      -locations=filesystem:/flyway/sql
      migrate
    volumes:
      - ./db_schema:/flyway/sql:ro
    restart: "no"
    networks:
      - net-db

networks:
  net-app1:
  net-app2:
  net-app3:
  net-db:
